services:
  postgres:
    image: postgres:16-alpine
    container_name: corpmail-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecurepassword123}
      POSTGRES_DB: ${POSTGRES_DB:-corpmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailuser} -d ${POSTGRES_DB:-corpmail}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corpmail-net

  redis:
    image: redis:7-alpine
    container_name: corpmail-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-supersecureredispassword123}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-supersecureredispassword123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corpmail-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: corpmail-backend
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    volumes:
      - ${MAIL_DIR:-/var/mail-platform/vmail}:/var/mail-platform/vmail
      - ${DKIM_DIR:-/var/mail-platform/dkim}:/var/mail-platform/dkim
      - ${SSL_DIR:-/var/mail-platform/ssl}:/var/mail-platform/ssl
      - ${CERTBOT_DIR:-/var/mail-platform/certbot}:/var/www/certbot
      - ${BACKUP_DIR:-/var/mail-platform/backups}:/var/mail-platform/backups
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - corpmail-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: corpmail-worker
    restart: always
    command: ["python", "-m", "app.workers.scheduler"]
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    volumes:
      - ${MAIL_DIR:-/var/mail-platform/vmail}:/var/mail-platform/vmail
      - ${DKIM_DIR:-/var/mail-platform/dkim}:/var/mail-platform/dkim
      - ${SSL_DIR:-/var/mail-platform/ssl}:/var/mail-platform/ssl
      - ${CERTBOT_DIR:-/var/mail-platform/certbot}:/var/www/certbot
      - ${BACKUP_DIR:-/var/mail-platform/backups}:/var/mail-platform/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - corpmail-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: corpmail-frontend
    restart: always
    networks:
      - corpmail-net

  postfix:
    build:
      context: ./docker/postfix
      dockerfile: Dockerfile
    container_name: corpmail-postfix
    restart: always
    hostname: ${PRIMARY_HOSTNAME:-mail.example.com}
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    env_file:
      - .env
    volumes:
      - ./docker/postfix/main.cf:/etc/postfix/main.cf:ro
      - ./docker/postfix/master.cf:/etc/postfix/master.cf:ro
      - ./docker/postfix/sql:/etc/postfix/sql
      - ${MAIL_DIR:-/var/mail-platform/vmail}:/var/mail-platform/vmail
      - ${SSL_DIR:-/var/mail-platform/ssl}:/etc/ssl/certs/corpmail:ro
      - ${DKIM_DIR:-/var/mail-platform/dkim}:/etc/dkim:ro
    depends_on:
      - postgres
      - dovecot
    networks:
      - corpmail-net

  dovecot:
    build:
      context: ./docker/dovecot
      dockerfile: Dockerfile
    container_name: corpmail-dovecot
    restart: always
    hostname: ${PRIMARY_HOSTNAME:-mail.example.com}
    ports:
      - "143:143"
      - "993:993"
    env_file:
      - .env
    volumes:
      - ./docker/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./docker/dovecot/conf.d:/etc/dovecot/conf.d:ro
      - ./docker/dovecot/dovecot-sql.conf.ext:/etc/dovecot/dovecot-sql.conf.ext
      - ${MAIL_DIR:-/var/mail-platform/vmail}:/var/mail-platform/vmail
      - ${SSL_DIR:-/var/mail-platform/ssl}:/etc/ssl/certs/corpmail:ro
    depends_on:
      - postgres
    networks:
      - corpmail-net

  rspamd:
    image: rspamd/rspamd:latest
    container_name: corpmail-rspamd
    restart: always
    ports:
      - "11334:11334"
      - "11332:11332"
    volumes:
      - ./docker/rspamd/local.d:/etc/rspamd/local.d:ro
      - ${DKIM_DIR:-/var/mail-platform/dkim}:/var/lib/rspamd/dkim:ro
      - redis_data:/var/lib/redis
    depends_on:
      - redis
    networks:
      - corpmail-net

  clamav:
    image: clamav/clamav:latest
    container_name: corpmail-clamav
    restart: always
    environment:
      # Memory Optimization: Prevent loading 2 databases simultaneously during updates (prevents 100% RAM spike)
      - CLAMD_CONF_ConcurrentDatabaseReload=no
      # Thread Optimization: Default 10 threads multiplies memory buffers; 2 is optimal for mail
      - CLAMD_CONF_MaxThreads=2
      - CLAMD_CONF_MaxQueue=10
      # Scan Limits: Tailor for corporate email attachments (Rspamd cap is 20MB)
      - CLAMD_CONF_MaxScanSize=30M
      - CLAMD_CONF_MaxFileSize=25M
      - CLAMD_CONF_StreamMaxLength=25M
      - CLAMD_CONF_MaxRecursion=10
      - CLAMD_CONF_MaxFiles=1000
      - CLAMD_CONF_PCREMaxFileSize=10M
      - CLAMD_CONF_BytecodeSecurity=TrustSigned
      - CLAMD_CONF_ExitOnOOM=yes
      # Freshclam Optimization: Check updates 4x/day, disable duplicate in-memory test
      - FRESHCLAM_CONF_Checks=4
      - FRESHCLAM_CONF_TestDatabases=no
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 1800m
    networks:
      - corpmail-net

  nginx:
    image: nginx:alpine
    container_name: corpmail-nginx
    restart: always
    ports:
      - "${CONTROL_PORT:-7080}:7080"
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${SSL_DIR:-/var/mail-platform/ssl}:/etc/letsencrypt:ro
      - ${CERTBOT_DIR:-/var/mail-platform/certbot}:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - corpmail-net

volumes:
  postgres_data:
  redis_data:
  clamav_data:

networks:
  corpmail-net:
    driver: bridge
