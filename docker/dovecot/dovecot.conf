# Dovecot main configuration for Corporate Mail Platform
protocols = imap lmtp
listen = *, [::]

# Base directory for run-time data
base_dir = /var/run/dovecot/

# Authentication processes
!include conf.d/10-auth.conf
!include conf.d/10-mail.conf
!include conf.d/10-master.conf
!include conf.d/10-ssl.conf

# Log to stdout/stderr for Docker log collectors
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stderr
