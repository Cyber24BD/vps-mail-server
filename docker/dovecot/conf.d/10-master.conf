# Dovecot Master Process Service Configuration
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 1
  client_limit = 1000
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  # Postfix SASL authentication listener over TCP
  inet_listener auth {
    port = 12345
  }
}

service auth-worker {
  user = root
}
